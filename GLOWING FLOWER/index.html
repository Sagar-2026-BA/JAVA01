<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magical Glowing Flower</title>

<style>

/* =========================================================
   PAGE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 50% 45%,
            #351438 0%,
            #170b21 35%,
            #080611 70%,
            #020207 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}


/* =========================================================
   AMBIENT GLOW
========================================================= */

.ambient {
    position: fixed;

    left: 50%;
    top: 45%;

    width: 420px;
    height: 420px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255, 70, 170, 0.08);

    filter: blur(70px);

    animation: ambientPulse 4s ease-in-out infinite alternate;
}

@keyframes ambientPulse {

    from {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.5;
    }

    to {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
    }
}


/* =========================================================
   FLOWER
========================================================= */

.flower {

    position: relative;

    width: min(75vw, 560px);
    height: min(75vw, 560px);

    display: flex;
    justify-content: center;
    align-items: center;

    animation: flowerFloat 5s ease-in-out infinite;
}

@keyframes flowerFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================================================
   PETAL
========================================================= */

.petal {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 18%;
    height: 42%;

    transform-origin: 50% 100%;

    border-radius:
        55% 55% 48% 48% /
        70% 70% 30% 30%;

    background:
        radial-gradient(
            ellipse at 50% 82%,
            #fffbd7 0%,
            #ffe58b 12%,
            #ffb36d 30%,
            #ff719d 57%,
            #e33c91 80%,
            #9c216d 100%
        );

    box-shadow:
        inset 0 -8px 18px rgba(174, 25, 100, 0.25),
        0 0 8px #ffe49a,
        0 0 20px #ff9b91,
        0 0 42px rgba(255, 70, 170, 0.8);

    opacity: 0;

    animation:
        bloom 7s cubic-bezier(.45, 0, .2, 1) infinite;

    animation-delay:
        calc(var(--i) * 0.13s);
}


/* =========================================================
   PETAL POSITIONS
========================================================= */

.petal:nth-child(1)  { --i: 0;  --angle: 0deg; }
.petal:nth-child(2)  { --i: 1;  --angle: 30deg; }
.petal:nth-child(3)  { --i: 2;  --angle: 60deg; }
.petal:nth-child(4)  { --i: 3;  --angle: 90deg; }
.petal:nth-child(5)  { --i: 4;  --angle: 120deg; }
.petal:nth-child(6)  { --i: 5;  --angle: 150deg; }
.petal:nth-child(7)  { --i: 6;  --angle: 180deg; }
.petal:nth-child(8)  { --i: 7;  --angle: 210deg; }
.petal:nth-child(9)  { --i: 8;  --angle: 240deg; }
.petal:nth-child(10) { --i: 9;  --angle: 270deg; }
.petal:nth-child(11) { --i: 10; --angle: 300deg; }
.petal:nth-child(12) { --i: 11; --angle: 330deg; }


/* =========================================================
   BLOOM ANIMATION
========================================================= */

@keyframes bloom {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(0.05);
    }

    8% {

        opacity: 0.2;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(0.35);
    }

    18% {

        opacity: 1;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(1.08);
    }

    28% {

        opacity: 1;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(1);
    }

    65% {

        opacity: 1;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(1);
    }

    82% {

        opacity: 1;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(1.05);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -100%)
            rotate(var(--angle))
            scale(0.05);
    }
}


/* =========================================================
   PETAL VEINS
========================================================= */

.petal::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: 8%;

    width: 2px;
    height: 72%;

    transform: translateX(-50%);

    background:
        linear-gradient(
            to top,
            rgba(255, 250, 190, 0.7),
            rgba(255, 180, 200, 0)
        );

    filter: blur(1px);

    opacity: 0.55;
}


/* =========================================================
   INNER PETALS
========================================================= */

.inner {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 14%;
    height: 30%;

    transform-origin: 50% 100%;

    border-radius:
        55% 55% 45% 45% /
        70% 70% 30% 30%;

    background:
        radial-gradient(
            ellipse at 50% 85%,
            #fffbd8,
            #ffd66d 20%,
            #ff8fa3 55%,
            #d52d86 100%
        );

    box-shadow:
        0 0 10px #fff0a0,
        0 0 25px #ff8ca5,
        0 0 45px #ff4c9b;

    opacity: 0;

    animation:
        innerBloom 7s ease-in-out infinite;
}


.inner:nth-of-type(13) {
    --inner-angle: 30deg;
}

.inner:nth-of-type(14) {
    --inner-angle: 90deg;
}

.inner:nth-of-type(15) {
    --inner-angle: 150deg;
}

.inner:nth-of-type(16) {
    --inner-angle: 210deg;
}

.inner:nth-of-type(17) {
    --inner-angle: 270deg;
}

.inner:nth-of-type(18) {
    --inner-angle: 330deg;
}


@keyframes innerBloom {

    0%, 20% {

        opacity: 0;

        transform:
            translate(-50%, -100%)
            rotate(var(--inner-angle))
            scale(0);
    }

    35% {

        opacity: 1;

        transform:
            translate(-50%, -100%)
            rotate(var(--inner-angle))
            scale(1.05);
    }

    60% {

        opacity: 1;

        transform:
            translate(-50%, -100%)
            rotate(var(--inner-angle))
            scale(1);
    }

    85%, 100% {

        opacity: 0;

        transform:
            translate(-50%, -100%)
            rotate(var(--inner-angle))
            scale(0);
    }
}


/* =========================================================
   FLOWER CENTER
========================================================= */

.center {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 17%;

    aspect-ratio: 1;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fffbd0 15%,
            #ffe36b 35%,
            #ffad4f 62%,
            #ff558d 100%
        );

    box-shadow:
        0 0 8px white,
        0 0 18px #fff3a0,
        0 0 35px #ffd45d,
        0 0 65px #ff8a67,
        0 0 100px rgba(255, 70, 170, 0.9);

    z-index: 30;

    animation: centerGlow 2s ease-in-out infinite alternate;
}


@keyframes centerGlow {

    from {

        transform:
            translate(-50%, -50%)
            scale(0.9);

        filter: brightness(0.9);
    }

    to {

        transform:
            translate(-50%, -50%)
            scale(1.18);

        filter: brightness(1.4);
    }
}


/* =========================================================
   CENTER RING
========================================================= */

.center::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 150%;
    height: 150%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 1px solid rgba(255, 225, 140, 0.35);

    box-shadow:
        0 0 20px rgba(255, 190, 100, 0.5);

    animation: ringPulse 2s ease-in-out infinite;
}

@keyframes ringPulse {

    0%, 100% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.3;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0.8;
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #fff4b0;

    box-shadow:
        0 0 5px white,
        0 0 12px #ffe16e,
        0 0 25px #ff72a8;

    pointer-events: none;

    z-index: 50;

    animation:
        particleFly var(--duration) ease-out forwards;
}


@keyframes particleFly {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    10% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(0.2);
    }
}


/* =========================================================
   TITLE
========================================================= */

.title {

    position: fixed;

    bottom: 5%;

    width: 100%;

    text-align: center;

    color: #ffe9bf;

    font-size:
        clamp(13px, 2vw, 21px);

    letter-spacing: 5px;

    text-shadow:
        0 0 8px #fff0bd,
        0 0 18px #ff7aa9,
        0 0 35px #ff4c99;

    animation:
        titleGlow 2.5s ease-in-out infinite alternate;
}


@keyframes titleGlow {

    from {
        opacity: 0.55;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .flower {

        width: 92vw;
        height: 92vw;
    }

    .title {

        letter-spacing: 3px;
    }
}

</style>
</head>


<body>


<div class="ambient"></div>


<div class="flower">


    <!-- OUTER PETALS -->

    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>


    <!-- INNER PETALS -->

    <div class="inner"></div>
    <div class="inner"></div>
    <div class="inner"></div>
    <div class="inner"></div>
    <div class="inner"></div>
    <div class="inner"></div>


    <!-- CENTER -->

    <div class="center"></div>

</div>


<div class="title">
    ✦ BANGARAM😘🥰 ✦
</div>


<script>

/* =========================================================
   PARTICLE ENGINE
========================================================= */

const flower = document.querySelector(".flower");


function createParticle() {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";


    /* Random direction */

    const angle =
        Math.random() *
        Math.PI * 2;


    /* Random distance */

    const distance =
        150 +
        Math.random() * 280;


    const x =
        Math.cos(angle) * distance;


    const y =
        Math.sin(angle) * distance;


    particle.style.setProperty(
        "--x",
        `${x}px`
    );


    particle.style.setProperty(
        "--y",
        `${y}px`
    );


    /* Random size */

    const size =
        2 +
        Math.random() * 4;


    particle.style.width =
        `${size}px`;

    particle.style.height =
        `${size}px`;


    /* Random speed */

    const duration =
        2.5 +
        Math.random() * 3;


    particle.style.setProperty(
        "--duration",
        `${duration}s`
    );


    flower.appendChild(
        particle
    );


    setTimeout(
        () => particle.remove(),
        duration * 1000
    );
}


/* =========================================================
   CONTINUOUS SPARKLES
========================================================= */

setInterval(
    createParticle,
    100
);


/* =========================================================
   INITIAL PARTICLES
========================================================= */

for (
    let i = 0;
    i < 60;
    i++
) {

    setTimeout(
        createParticle,
        i * 50
    );
}


/* =========================================================
   EXTRA BLOOM BURST
========================================================= */

setInterval(() => {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        setTimeout(
            createParticle,
            i * 25
        );
    }

}, 7000);

</script>

</body>

</html>
